  celestrak_gp:
    current_tracking_role: PRIMARY
    provider: CelesTrak
    upstream_origin: USSF GP data via Space-Track/CelesTrak distribution; individual observation set and fit revision UNKNOWN
    transport: unauthenticated HTTPS GET
    endpoint: https://celestrak.org/NORAD/elements/gp.php?CATNR=25544&FORMAT=TLE
    satellite_identifier: 'NORAD 25544; ISS (ZARYA) in observed response'
    source_kind: source_provided_gp_orbital_elements
    selected_format: TLE
    transport_status: VERIFIED
    current_payload_status: VERIFIED
    verification_date: 2026-09-28
    observation_time_utc: '2026-09-28T13:58:32Z (HTTP response Date, not publication)'
    latest_comparison_fixture_retrieved_at_utc: '2026-09-28T14:26:25Z (separate earlier orbital-core response; reused in SupGP comparison)'
    latest_comparison_fixture_age_at_retrieval: '+11 h 01 min 45.164992 s'
    observed_element_epoch_utc: '2026-09-28T03:24:39.835008Z'
    observed_element_age_at_response: 'approximately 10 h 34 min; no GOOD/accuracy inference'
    observed_epoch_token: '26271.14212772'
    observed_payload: 'Three lines: ISS (ZARYA), TLE line 1, TLE line 2; both catalog 25544, 69 characters/checksums valid'
    publication_time: null
    source_quality_status: No per-set accuracy/status field in tested TLE response
    update_behavior: 'Provider usage guidance: request no more often than approximately two-hour GP update cycle; no exact ISS publication SLA.'
    usage_limitations: 'Fetch only needed data once per update; on any non-200, stop automated queries and report for investigation. Repeated error queries can be firewalled. Raw-response redistribution permission not verified.'
    evidence: [celestrak_gp_formats, celestrak_tle_format, celestrak_iss_tle, celestrak_usage]
    implementation_readiness: READY_FOR_IMPLEMENTATION
    mvp_phase: MVP1
  celestrak_iss_e_supgp:
    provider: CelesTrak
    upstream_origin: NASA ISS OEM predicted ephemeris, transformed by CelesTrak SGP4 fitting
    source_kind: source_provided_supplemental_gp_orbital_elements
    current_tracking_role: DEFERRED
    transport: unauthenticated HTTPS GET
    endpoint: https://celestrak.org/NORAD/elements/supplemental/sup-gp.php?SOURCE=ISS-E&FORMAT=TLE
    satellite_identifier: 'NORAD 25544; ISS [Segment NN] in observed response'
    selected_format_for_probe: TLE/3LE
    transport_status: VERIFIED
    current_payload_status: VERIFIED
    verification_date: 2026-09-28
    observation_time_utc: '2026-09-28T14:45:37Z (HTTP response Date, not publication)'
    observed_count: 60
    observed_first_element_epoch_utc: '2026-09-25T16:57:11.696832Z'
    observed_last_element_epoch_utc: '2026-10-10T10:59:59.999712Z'
    observed_current_candidate: 'Segment 12 at 2026-09-28T10:57:11.696832Z for comparison time 2026-09-28T14:45:37Z; no production selection rule established'
    observed_candidate_fit_rms: '0.138 km relative to source data, not truth error or pointwise accuracy'
    publication_time: null
    segment_selection_status: BLOCKED_EXACT_INTERVAL_BOUNDARIES_UNVERIFIED
    update_behavior: 'CelesTrak checks known public orbital-data sources daily; NASA says OEM updates approximately three times weekly. No per-ISS SupGP publication SLA verified.'
    usage_limitations: 'Same CelesTrak usage policy as standard GP; two-hour SupGP download guidance is not a quality threshold; unrestricted raw-response redistribution permission unverified.'
    evidence: [celestrak_supgp_queries, celestrak_supgp_index, celestrak_iss_e_tle, celestrak_iss_e_rms, nasa_oem_page, nasa_oem_txt, celestrak_usage]
    verification_record: iss-supgp-source-selection.md
    implementation_readiness: DEFERRED_PENDING_SEGMENT_SELECTION_EVIDENCE
    mvp_phase: DEFERRED
  space_track_gp:
    provider: Space-Track
    upstream_origin: USSF GP
    source_kind: authenticated_gp_api
    documentation_status: VERIFIED
    current_payload_status: UNVERIFIED
    implementation_readiness: BLOCKED_FOR_MVP1_ACCOUNT_AND_TERMS_REVIEW
    evidence: [space_track_docs, space_track_terms]
    mvp_phase: FUTURE_OPTIONAL
  sscweb:
    provider: NASA GSFC/SPDF SSCWeb
    upstream_origin: TLE-derived ISS orbit ephemeris; individual TLE supplier/revision not exposed in response
    transport: HTTPS REST interval query, XML response
    endpoint_base: https://sscweb.gsfc.nasa.gov/WS/sscr/2/
    observatory_identifier: iss
    source_kind: queryable_orbit_ephemeris
    transport_status: VERIFIED
    current_payload_status: VERIFIED
    implementation_readiness: READY_FOR_SECONDARY_REFERENCE_IMPLEMENTATION
    verification_date: 2026-09-28
    evidence: [sscweb_home, sscweb_rest, sscweb_schema, sscweb_iss_observation, sscweb_iss_location_observation, sscweb_provenance, sscweb_frame, sscweb_units, sscweb_json_notice]
    observation: >-
      2026-09-28 UTC: unauthenticated GET observatories returned Id=iss,
      Resolution=60, StartTime=1998-11-21T00:00:00.000Z and
      EndTime=2026-10-11T00:00:00.000Z. GET locations for 2026-09-27
      12:00-12:05 UTC returned HTTP 200, Success and six UTC epochs with
      six Geo and GeiJ2000 coordinate sets. A 2026-10-05 12:00-12:02
      UTC future-range query returned three Geo points. XML GET lacked
      Last-Modified and per-point definitive/predictive/status fields.
    temporal_classification: 'TLE-derived ephemeris; NASA lists both definitive and predictive ISS coverage; pointwise segment UNKNOWN'
    source_quality_status: No per-point quality/status in observed basic GET response
    update_behavior: 'NASA provenance table says weekly for both ISS definitive and predictive sources; not a polling SLA.'
    mvp_phase: SECONDARY_DEFERRED
