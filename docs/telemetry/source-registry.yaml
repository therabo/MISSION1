# Evidence ledger, not an application registry. YAML merge keys expand the common
# fields in each parameter record. No PARTIALLY_VERIFIED entry is a production mapping.
schema_version: 1
verified_on: 2026-09-28
identifier_convention: >-
  Lowercase iss.<semantic-scope>.<quantity>, with snake_case quantity; provider IDs
  remain source mappings. GP element and propagated-state IDs denote distinct
  source-provided and computed concepts; existing SSCWeb/OEM IDs remain scoped
  to their verified ephemeris records.
