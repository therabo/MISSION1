defaults:
  celestrak_gp: &celestrak_gp
    provider: CelesTrak
    upstream_origin: USSF GP via Space-Track/CelesTrak distribution
    transport_source: celestrak_gp / CATNR=25544 / FORMAT=TLE
    module: null
    subsystem: null
    source_timestamp_semantics: 'TLE element epoch in UTC; source creation/publication and onboard measurement time UNKNOWN'
    reception_timestamp_semantics: MISSION1 retrievedAtUtc recorded separately
    reference_frame: 'TLE mean elements; Orekit propagated output native TEME; elements themselves are not Cartesian coordinates'
    classification: SOURCE_PROVIDED_ORBITAL_ELEMENTS; not onboard telemetry or measured position
    source_quality_status: No per-set accuracy/status field in observed response; structural validation and age quality are MISSION1-derived
    update_behavior: 'Provider asks refresh no more often than approximate two-hour GP cycle; not a freshness guarantee.'
    verification_status: VERIFIED
    verification_date: 2026-09-28
    authoritative_evidence: [celestrak_gp_formats, celestrak_tle_format, celestrak_iss_tle, celestrak_usage]
    limitations: 'Publication time and fit accuracy unknown; TLE five-digit catalog limitation; model estimates degrade with age/maneuvers.'
    mvp_phase: MVP1
    implementation_readiness: READY_FOR_IMPLEMENTATION
    notes: 'Preserve two raw lines, parsed epoch, identity and retrieval time; never call a computed state source-provided.'
  sscweb: &sscweb
    provider: NASA GSFC/SPDF SSCWeb
    upstream_origin: TLE-derived ISS orbit ephemeris; individual TLE revision UNKNOWN
    transport_source: sscweb / XML GET locations / iss
    module: null
    subsystem: null
    source_timestamp_semantics: 'Data/Time[i] = ephemeris point epoch, UTC; measurement and publication times UNKNOWN'
    reception_timestamp_semantics: MISSION1 HTTP fetch time, recorded separately
    classification: SOURCE_PROVIDED_EPHEMERIS; TLE basis; pointwise definitive/predictive UNKNOWN; not MEASURED or LIVE
    source_quality_status: No per-point flag in observed response; MISSION1 validation/fetch health are computed
    update_behavior: 'Interval-query service; observed one-minute point spacing for the tested range; source table says weekly updates, no SLA.'
    verification_status: VERIFIED
    verification_date: 2026-09-28
    authoritative_evidence: [sscweb_rest, sscweb_schema, sscweb_iss_location_observation, sscweb_provenance, sscweb_frame, sscweb_units]
    limitations: 'Pointwise definitive/predictive flag and source publication time unavailable; not real-time telemetry.'
    mvp_phase: SECONDARY_DEFERRED
    implementation_readiness: READY_FOR_SECONDARY_REFERENCE_IMPLEMENTATION
    notes: Keep data query and epoch separate from fetch time; require equal Time/X/Y/Z array lengths.
  live: &live
    provider: Lightstreamer
    upstream_origin: NASA ISS telemetry, per Lightstreamer
    transport_source: isslive_bridge / MERGE item / published symbol dictionary
    internal_semantic_id: null
    module: null
    subsystem: null
    type: UNKNOWN; numeric formatting suggested by provider Format_Spec, payload unobserved
    source_unit_interpretation: Dictionary UNITS metadata only; streamed Value unit unverified
    normalized_unit: null
    source_timestamp_semantics: 'TimeStamp field exists; measurement/publication/update time UNKNOWN'
    reception_timestamp_semantics: MISSION1 callback time only, when an update arrives
    reference_frame: null
    classification: SOURCE_PROVIDED; measurement status UNKNOWN
    source_quality_status: 'Status.Class, Status.Indicator, Status.Color requested by provider example; payload and meanings UNKNOWN'
    update_behavior: UNKNOWN; no item update observed
    verification_status: PARTIALLY_VERIFIED
    verification_date: 2026-09-28
    authoritative_evidence: [lightstreamer_dictionary, lightstreamer_subscriber]
    limitations: 'Current value delivery unobserved; Value/CalibratedData relation and source timestamp semantics unknown.'
    mvp_phase: MVP3_or_later_pending_verification
    implementation_readiness: BLOCKED
    notes: No production mapping; exact module/subsystem ownership unverified.
  oem: &oem
    provider: NASA/JSC/FOD/TOPO
    upstream_origin: NASA/JSC/FOD/TOPO
    transport_source: nasa_oem / current TXT and XML
    module: null
    subsystem: null
    type: decimal state-vector component
    source_timestamp_semantics: state-vector EPOCH in UTC; file CREATION_DATE is separate
    reception_timestamp_semantics: MISSION1 fetch time, when integrated
    reference_frame: EME2000, Earth-centered (as current file metadata)
    classification: SOURCE_PROVIDED_PREDICTED_EPHEMERIS; not live or measured
    source_quality_status: No per-state quality flag documented on NASA page
    update_behavior: 'NASA says approximately three publications per week; states nominally every 4 minutes, 2 seconds during reboosts.'
    verification_status: VERIFIED
    verification_date: 2026-09-28
    authoritative_evidence: [nasa_oem_page, nasa_oem_txt, nasa_oem_xml]
    limitations: 'Prediction accumulates error; bounded by OEM segment/usable times; stable current URL is overwritten.'
    mvp_phase: MVP2_trajectory_comparison_implemented
    implementation_readiness: IMPLEMENTED_AS_SECONDARY_COMPARISON; not live telemetry
    notes: Preserve file creation and fetch times; verify Orekit EME2000 mapping and interpolation before derived Earth coordinates.

parameters:
  - <<: *celestrak_gp
    external_identifier: 'CATNR=25544&FORMAT=TLE / line 1 + line 2'
    internal_semantic_id: iss.orbit.gp_elements
    display_name: ISS GP orbital element set
    semantic_meaning: 'Coherent source-provided ISS general perturbation mean orbital elements used as TLEPropagator input.'
    type: two-line element set (ASCII fixed-width strings)
    source_unit: 'TLE encoded fields; no single physical unit for the set'
    normalized_unit: null
    notes: 'MVP1 source record; element epoch is not propagation time or publication time.'
  - <<: *sscweb
    external_identifier: 'Data[Id=iss]/Coordinates[CoordinateSystem=Geo]/{X,Y,Z} with Data/Time[i]'
    internal_semantic_id: iss.orbit.geo_position
    display_name: ISS SSCWeb GEO Cartesian position
    semantic_meaning: 'Three-dimensional Earth-centered position in SSCWeb Geo coordinates at the corresponding ephemeris point epoch.'
    type: coherent tuple of X/Y/Z xsd:double values indexed by Data/Time[i]
    source_unit: km per component
    normalized_unit: km per component; no conversion
    reference_frame: 'SSCWeb Geo: Earth-rotating geographic, geocentric Cartesian frame; not asserted to be a specific ITRF realization'
    notes: 'External identifier is a documented XML selector, not a provider PUI. Keep the three components coherent at one Time[i]. Secondary/reference record; no velocity or geodetic altitude.'
  - <<: *live
    external_identifier: USLAB000058
    display_name: Cabin pressure
    semantic_meaning: 'Provider description: Cabin pressure; OPS_NOM LAB_PCA_Cabin_Pressure.'
    source_unit: PSI
    limitations: 'No value delivered; physical module owner, Value/CalibratedData representation and source time unverified. Specification example in torr conflicts with dictionary.'
    mvp_phase: MVP3_or_later_pending_verification
    notes: First candidate for a live non-orbital probe; do not assign DESTINY/ECLSS without evidence.
