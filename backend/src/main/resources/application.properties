# Local defaults match the root compose.yaml. Override all three settings outside development.
spring.datasource.url=${MISSION1_DB_URL:jdbc:postgresql://localhost:5432/mission1}
spring.datasource.username=${MISSION1_DB_USER:mission1}
spring.datasource.password=${MISSION1_DB_PASSWORD:mission1_local}

# Platform health is independent of mission-data acquisition. Management stays internal in Compose.
management.endpoints.web.exposure.include=health
management.endpoints.jmx.exposure.exclude=*
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db

# MISSION1 provider-use policy; independent of orbital-current-v1. Durable eligibility protects restart loops.
mission1.orbital.celestrak.refresh.enabled=${MISSION1_CELESTRAK_REFRESH_ENABLED:true}
mission1.orbital.celestrak.refresh.interval=${MISSION1_CELESTRAK_REFRESH_INTERVAL:PT2H10M}

# Crew source capabilities; automatic ingestion is delayed and has no public API.
# ISS is the MISSION1 station concept; 4 is solely its verified LL2 external mapping.
mission1.crew.ll2.base-url=${MISSION1_CREW_LL2_BASE_URL:https://ll.thespacedevs.com/2.3.0/}
mission1.crew.ll2.iss-external-id=${MISSION1_CREW_LL2_ISS_EXTERNAL_ID:4}
mission1.crew.request-timeout=${MISSION1_CREW_REQUEST_TIMEOUT:PT20S}

# MISSION1 low-frequency LL2 request policy. No immediate startup request or per-run retry.
mission1.crew.ingestion.enabled=${MISSION1_CREW_INGESTION_ENABLED:true}
mission1.crew.ingestion.fixed-delay=${MISSION1_CREW_INGESTION_FIXED_DELAY:PT2H}
mission1.crew.ingestion.initial-delay=${MISSION1_CREW_INGESTION_INITIAL_DELAY:PT5M}

# Official NASA RSS verification; independent delayed source pipeline, zero retries.
mission1.crew.verification.enabled=${MISSION1_CREW_VERIFICATION_ENABLED:true}
mission1.crew.verification.fixed-delay=${MISSION1_CREW_VERIFICATION_FIXED_DELAY:PT2H}
mission1.crew.verification.initial-delay=${MISSION1_CREW_VERIFICATION_INITIAL_DELAY:PT10M}
mission1.crew.verification.primary-max-age=${MISSION1_CREW_PRIMARY_MAX_AGE:PT6H}
mission1.crew.verification.fetch-max-age=${MISSION1_CREW_VERIFICATION_FETCH_MAX_AGE:PT6H}
mission1.crew.verification.current-assertion-max-age=${MISSION1_CREW_CURRENT_ASSERTION_MAX_AGE:P7D}
mission1.crew.verification.event-implication-max-age=${MISSION1_CREW_EVENT_IMPLICATION_MAX_AGE:P14D}

# Crew event-aware policy (ADR-0010). One bounded operation/tick; source flags above still apply.
mission1.crew.refresh.event-aware.enabled=${MISSION1_CREW_EVENT_AWARE_ENABLED:true}
mission1.crew.refresh.tick=${MISSION1_CREW_REFRESH_TICK:PT1M}
mission1.crew.refresh.catalog-enabled=${MISSION1_CREW_EVENT_CATALOG_ENABLED:true}
mission1.crew.refresh.catalog-interval=${MISSION1_CREW_EVENT_CATALOG_INTERVAL:PT6H}
mission1.crew.refresh.catalog-initial-delay=${MISSION1_CREW_EVENT_CATALOG_INITIAL_DELAY:PT15M}
mission1.crew.refresh.catalog-max-age=${MISSION1_CREW_EVENT_CATALOG_MAX_AGE:PT12H}
mission1.crew.refresh.pre-window=${MISSION1_CREW_EVENT_PRE_WINDOW:PT6H}
mission1.crew.refresh.post-window=${MISSION1_CREW_EVENT_POST_WINDOW:PT6H}
mission1.crew.refresh.crewed-interval=${MISSION1_CREW_CREWED_REFRESH_INTERVAL:PT30M}
mission1.crew.refresh.unknown-interval=${MISSION1_CREW_UNKNOWN_REFRESH_INTERVAL:PT1H}
mission1.crew.refresh.follow-up-interval=${MISSION1_CREW_FOLLOW_UP_INTERVAL:PT1H}
mission1.crew.refresh.follow-up-horizon=${MISSION1_CREW_FOLLOW_UP_HORIZON:PT24H}
mission1.crew.refresh.max-follow-up-attempts=${MISSION1_CREW_MAX_FOLLOW_UP_ATTEMPTS:6}
mission1.crew.refresh.ll2-hourly-budget=${MISSION1_CREW_LL2_HOURLY_BUDGET:12}

# ADR-0021: NASA Crew resource acquisition supplies retained editorial evidence.
mission1.crew.editorial.enabled=${MISSION1_CREW_EDITORIAL_ENABLED:true}
mission1.crew.editorial.fixed-delay=${MISSION1_CREW_EDITORIAL_FIXED_DELAY:PT2H}
mission1.crew.editorial.initial-delay=${MISSION1_CREW_EDITORIAL_INITIAL_DELAY:PT15M}
mission1.crew.editorial.topic-url=${MISSION1_CREW_EDITORIAL_TOPIC_URL:https://www.nasa.gov/international-space-station/space-station-research-and-technology/latest-news-from-space-station-research/}

# ADR-0021: Crew membership materialization; Current publication keeps canonical identity.
mission1.crew.membership.enabled=${MISSION1_CREW_MEMBERSHIP_ENABLED:true}
mission1.crew.membership.fixed-delay=${MISSION1_CREW_MEMBERSHIP_FIXED_DELAY:PT1M}
mission1.crew.membership.initial-delay=${MISSION1_CREW_MEMBERSHIP_INITIAL_DELAY:PT15M}
mission1.crew.membership.roster-max-age=${MISSION1_CREW_MEMBERSHIP_ROSTER_MAX_AGE:PT6H}
mission1.crew.membership.topic-max-age=${MISSION1_CREW_MEMBERSHIP_TOPIC_MAX_AGE:PT6H}
mission1.crew.membership.personal-max-age=${MISSION1_CREW_MEMBERSHIP_PERSONAL_MAX_AGE:P7D}

# ADR-0021: production operational subject binding. Scheduling remains bounded and independent of HTTP reads.
mission1.crew.operational-binding.enabled=${MISSION1_CREW_OPERATIONAL_BINDING_ENABLED:true}
mission1.crew.operational-binding.fixed-delay=${MISSION1_CREW_OPERATIONAL_BINDING_DELAY:PT1M}
mission1.crew.operational-binding.initial-delay=${MISSION1_CREW_OPERATIONAL_BINDING_INITIAL_DELAY:PT15M}
mission1.crew.operational-binding.acquisition-delay=${MISSION1_CREW_OPERATIONAL_ACQUISITION_DELAY:PT5M}

# ADR-0024: bounded async retained bootstrap and one official native SDK owner.
mission1.telemetry.enabled=${MISSION1_TELEMETRY_ENABLED:true}
mission1.telemetry.native-enabled=${MISSION1_TELEMETRY_NATIVE_ENABLED:true}
mission1.telemetry.bootstrap-enabled=${MISSION1_TELEMETRY_BOOTSTRAP_ENABLED:true}
mission1.telemetry.native-endpoint=${MISSION1_TELEMETRY_NATIVE_ENDPOINT:https://push.lightstreamer.com}
mission1.telemetry.adapter-set=${MISSION1_TELEMETRY_ADAPTER_SET:ISSLIVE}
mission1.telemetry.native-retry=${MISSION1_TELEMETRY_NATIVE_RETRY:PT30S}
mission1.telemetry.sensedata-endpoint=${MISSION1_TELEMETRY_SENSEDATA_ENDPOINT:https://iss.telemetry.space/events}
mission1.telemetry.isslive-endpoint=${MISSION1_TELEMETRY_ISSLIVE_ENDPOINT:https://api.iss.live/api/telemetry/stats/}
mission1.telemetry.timeout=${MISSION1_TELEMETRY_TIMEOUT:PT15S}
mission1.telemetry.queue-size=${MISSION1_TELEMETRY_QUEUE_SIZE:1024}
mission1.telemetry.batch-size=${MISSION1_TELEMETRY_BATCH_SIZE:64}
mission1.telemetry.sensedata-bootstrap-timeout=${MISSION1_TELEMETRY_SENSEDATA_BOOTSTRAP_TIMEOUT:PT30S}
mission1.telemetry.sensedata-max-event-bytes=${MISSION1_TELEMETRY_SENSEDATA_MAX_EVENT_BYTES:4194304}
mission1.telemetry.sensedata-max-records=${MISSION1_TELEMETRY_SENSEDATA_MAX_RECORDS:20700}

# Retained fallback/recovery; durable deadlines survive restart, successful empty passes included.
mission1.telemetry.retained-reconciliation.enabled=${MISSION1_TELEMETRY_RETAINED_RECONCILIATION_ENABLED:true}
mission1.telemetry.retained-reconciliation.interval=${MISSION1_TELEMETRY_RETAINED_RECONCILIATION_INTERVAL:PT30M}
mission1.telemetry.retained-reconciliation.maximum-backoff=${MISSION1_TELEMETRY_RETAINED_RECONCILIATION_MAXIMUM_BACKOFF:PT6H}
