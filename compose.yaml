services:
  postgres:
    image: postgres:16.10
    environment:
      POSTGRES_DB: mission1
      POSTGRES_USER: mission1
      # Local development only; override MISSION1_DB_PASSWORD outside a local machine.
      POSTGRES_PASSWORD: ${MISSION1_DB_PASSWORD:-mission1_local}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - mission1-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mission1 -d mission1"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mission1-postgres:
