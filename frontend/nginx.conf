worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    types {
        model/gltf-binary glb;
    }
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;

    # Docker's embedded DNS follows backend replacements without restarting nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;
    upstream mission1_backend {
        zone mission1_backend 64k;
        server backend:8080 resolve;
    }
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_intercept_errors off;
    proxy_read_timeout 60s;

    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }
        location = /actuator { return 404; }
        location ^~ /actuator/ { return 404; }

        # No trailing URI on proxy_pass: preserve the entire path and query string.
        location = /api { proxy_pass http://mission1_backend; }
        location ^~ /api/ { proxy_pass http://mission1_backend; }

        location = /index.html {
            add_header Cache-Control "no-cache" always;
        }
        # Missing assets must not be replaced by the SPA HTML document.
        location ~ ^/(assets|cesiumStatic|models|skybox|geo|flags|imagery|branding)/ {
            try_files $uri =404;
        }
        location ~* \.(js|mjs|css|json|wasm|glb|webp|png|jpe?g|svg|ttf|woff2?|xml)$ {
            try_files $uri =404;
        }
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
